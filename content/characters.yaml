# The cast. A character keeps only what stays the same in every scenario they're in: the name and, for voice
# scenarios, one pinned ElevenLabs voice so every participant hears the same person. Each scenario has its own person
# (2026-11-03), so 24 voices play 48 people: one per stage each, never twice in a stage. Who they are in the scene is
# the scenario's `role`. `scenarios:import` copies the character into each frozen version, so a conversation keeps the
# voice it ran with even if this file changes later.

