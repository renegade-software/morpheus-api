opening: |-
  Hello,

  Thank you for agreeing to speak at the Small Business Forum on March 14th. Before we print the programme, could you confirm the title of your talk? Please also let me know what equipment you'll need, and whether you'll be joining us for the speakers' dinner at 8 pm.

  Best regards,
  Fiona Blake
  Programme organiser
