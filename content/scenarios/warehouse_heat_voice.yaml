# Tom's scenario by voice: the same scene as warehouse_heat.yaml, the path's next stop after the typed one
# (2026-10-29). Keep the two in step until the voice one gets a scene of its own. `bin/rails scenarios:import` freezes
# it like any scenario and voices its opening. The UI shares the typed one's brief (scenarios.warehouseHeat).
id: warehouseHeatVoice
level: 3 # B2
mode: voice # voice notes both ways; typed messages are refused
character: tom # a key in content/characters.yaml
role: "a new warehouse hire in his first week." # who the character is in this scenario; follows the name
personality: "Eager and friendly, a bit pushy. Wants the roof bonus and pushes back when told no, but respects a clear answer."
agenda:
  - "Asks how much water to drink and where to get it."
  - "Wants to go back up and finish the roof panels this afternoon."
  - "Pushes for the roof bonus at least twice, and gives in only to a clear, firm answer."
learner_role: "Tom's shift supervisor."
setting: "A warehouse floor on a very hot afternoon. The roof crew earns a bonus."
speech_register: "Professional but friendly. The supervisor should be firm without being rude."
opening: "Hey boss! It's boiling out there. Anything I should know before I head back out?"
goals:
  - id: water
    text: "Tell him to drink water."
  - id: waterSource
    text: "Tell him where he can get water."
  - id: inside
    text: "Ask him to work inside during the hottest part of the afternoon."
  - id: bonus
    text: "Say no when he pushes about the bonus for working on the roof."
turn_limit: 8 # learner turns; the agent adds a quarter of it as extra turns while a goal is open
