# Etapa 8 (B2+), stop 7. CEFR: Correspondence B2+ (p. 82).
id: closedClaim
level: 3 # B2
mode: writing
character: dana
role: "a claims officer at a courier company."
personality: "Polite but formulaic. Writes in standard customer-service language."
agenda:
