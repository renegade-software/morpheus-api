# Etapa 9 (C1), stop 2. CEFR: Sociolinguistic appropriateness C1 (p. 137); Conversation C1 (p. 73).
id: creditDue
level: 4 # C1
mode: voice
character: femi
role: "a classmate on the learner's evening master's course."
personality: "Energetic and charming, but a little defensive."
agenda:
