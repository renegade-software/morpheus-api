  Dear family,

  I'm writing to let you know that your grandmother will move to a room in our east wing next month, while her current room is renovated. We'll do everything we can to make the move easy for her. If you have any thoughts, please let me know.

  Warm regards,
  Susan Bright
  Care home manager
