# Rubric text Claude scores the placement test against, quoted word for word.
# Scores run A1 = 0, A2 = 1, B1 = 2, B2 = 3, C1 = 4, C2 = 5. "Plus" levels (A2+, B1+, B2+) from the
# Companion Volume are listed under their base level with an "Upper" label, since the 0–5 scale has no plus steps.
#
# Speaking: CEFR Table 3, "Qualitative aspects of spoken language use" (Council of Europe),
#   https://www.coe.int/en/web/common-european-framework-reference-languages/table-3-cefr-3.3-common-reference-levels-qualitative-aspects-of-spoken-language-use
#   Interaction is left out because the placement task is a monologue.
# Writing: CEFR Companion Volume with New Descriptors (Council of Europe, 2018): Overall written production (p. 75),
#   General linguistic range (p. 131), Grammatical accuracy (p. 133), Coherence and cohesion (p. 142).
#   Plus-level placement was read from the PDF's table layout; check against the printed volume before the thesis cites it.

speaking:
  range:
    C2: "Shows great flexibility reformulating ideas in differing linguistic forms to convey finer shades of meaning precisely, to give emphasis, to differentiate and to eliminate ambiguity. Also has a good command of idiomatic expressions and colloquialisms"
    C1: "Has a good command of a broad range of language allowing him/her to select a formulation to express him/ herself clearly in an appropriate style on a wide range of general, academic, professional or leisure topics without having to restrict what he/she wants to say."
    B2: "Has a sufficient range of language to be able to give clear descriptions, express viewpoints on most general topics, without much conspicuous searching for words, using some complex sentence forms to do so."
    B1: "Has enough language to get by, with sufficient vocabulary to express him/herself with some hesitation and circum-locutions on topics such as family, hobbies and interests, work, travel, and current events."
    A2: "Uses basic sentence patterns with memorised phrases, groups of a few words and formulae in order to communicate limited information in simple everyday situations."
    A1: "Has a very basic repertoire of words and simple phrases related to personal details and particular concrete situations."
  accuracy:
    C2: "Maintains consistent grammatical control of complex language, even while attention is otherwise engaged (e.g. in forward planning, in monitoring others' reactions)."
    C1: "Consistently maintains a high degree of grammatical accuracy; errors are rare, difficult to spot and generally corrected when they do occur."
    B2: "Shows a relatively high degree of grammatical control. Does not make errors which cause misunderstanding, and can correct most of his/her mistakes."
    B1: "Uses reasonably accurately a repertoire of frequently used \"routines\" and patterns associated with more predictable situations."
    A2: "Uses some simple structures correctly, but still systematically makes basic mistakes."
    A1: "Shows only limited control of a few simple grammatical structures and sentence patterns in a memorised repertoire."
  fluency:
    C2: "Can express him/herself spontaneously at length with a natural colloquial flow, avoiding or backtracking around any difficulty so smoothly that the interlocutor is hardly aware of it."
    C1: "Can express him/herself fluently and spontaneously, almost effortlessly. Only a conceptually difficult subject can hinder a natural, smooth flow of language."
    B2: "Can produce stretches of language with a fairly even tempo; although he/she can be hesitant as he or she searches for patterns and expressions, there are few noticeably long pauses."
    B1: "Can keep going comprehensibly, even though pausing for grammatical and lexical planning and repair is very evident, especially in longer stretches of free production."
    A2: "Can make him/herself understood in very short utterances, even though pauses, false starts and reformulation are very evident."
    A1: "Can manage very short, isolated, mainly pre-packaged utterances, with much pausing to search for expressions, to articulate less familiar words, and to repair communication."
  coherence:
    C2: "Can create coherent and cohesive discourse making full and appropriate use of a variety of organisational patterns and a wide range of connectors and other cohesive devices."
    C1: "Can produce clear, smoothly-flowing, well-structured speech, showing controlled use of organisational patterns, connectors and cohesive devices."
    B2: "Can use a limited number of cohesive devices to link his/her utterances into clear, coherent discourse, though there may be some \"jumpiness\" in a long contribution."
    B1: "Can link a series of shorter, discrete simple elements into a connected, linear sequence of points."
    A2: "Can link groups of words with simple connectors like \"and, \"but\" and \"because\"."
    A1: "Can link words or groups of words with very basic linear connectors like \"and\" or \"then\"."

writing:
  overall_written_production:
    C2: "Can write clear, smoothly flowing, complex texts in an appropriate and effective style and a logical structure which helps the reader to find significant points."
    C1: "Can write clear, well-structured texts of complex subjects, underlining the relevant salient issues, expanding and supporting points of view at some length with subsidiary points, reasons and relevant examples, and rounding off with an appropriate conclusion. Can employ the structure and conventions of a variety of written genres, varying the tone, style and register according to addressee, text type and theme."
    B2: "Can write clear, detailed texts on a variety of subjects related to his/her field of interest, synthesising and evaluating information and arguments from a number of sources."
    B1: "Can write straightforward connected texts on a range of familiar subjects within his/her field of interest, by linking a series of shorter discrete elements into a linear sequence."
    A2: "Can write a series of simple phrases and sentences linked with simple connectors like 'and,' 'but' and 'because'."
    A1: "Can give information in writing about matters of personal relevance (e.g. likes and dislikes, family, pets) using simple words and basic expressions. Can write simple isolated phrases and sentences."
  general_linguistic_range:
    C2: "Can exploit a comprehensive and reliable mastery of a very wide range of language to formulate thoughts precisely, give emphasis, differentiate and eliminate ambiguity. No signs of having to restrict what he/she wants to say."
    C1: "Can use a broad range of complex grammatical structures appropriately and with considerable flexibility. Can select an appropriate formulation from a broad range of language to express him/herself clearly, without having to restrict what he/she wants to say."
    B2: "Upper B2: Can express him/herself clearly and without much sign of having to restrict what he/she wants to say. B2: Has a sufficient range of language to be able to give clear descriptions, express viewpoints and develop arguments without much conspicuous searching for words, using some complex sentence forms to do so."
    B1: "Upper B1: Has a sufficient range of language to describe unpredictable situations, explain the main points in an idea or problem with reasonable precision and express thoughts on abstract or cultural topics such as music and films. B1: Has enough language to get by, with sufficient vocabulary to express him/herself with some hesitation and circumlocutions on topics such as family, hobbies and interests, work, travel, and current events, but lexical limitations cause repetition and even difficulty with formulation at times."
    A2: "Upper A2: Has a repertoire of basic language, which enables him/her to deal with everyday situations with predictable content, though he/she will generally have to compromise the message and search for words. A2: Can produce brief everyday expressions in order to satisfy simple needs of a concrete type: personal details, daily routines, wants and needs, requests for information. Can use basic sentence patterns and communicate with memorised phrases, groups of a few words and formulae about themselves and other people, what they do, places, possessions etc. Has a limited repertoire of short memorised phrases covering predictable survival situations; frequent breakdowns and misunderstandings occur in non-routine situations."
    A1: "Has a very basic range of simple expressions about personal details and needs of a concrete type. Can use some basic structures in one-clause sentences with some omission or reduction of elements."
  grammatical_accuracy:
    C2: "Maintains consistent grammatical control of complex language, even while attention is otherwise engaged (e.g. in forward planning, in monitoring others' reactions)."
    C1: "Consistently maintains a high degree of grammatical accuracy; errors are rare and difficult to spot."
    B2: "Upper B2: Good grammatical control. Occasional 'slips' or non-systematic errors and minor flaws in sentence structure may still occur, but they are rare and can often be corrected in retrospect. B2: Shows a relatively high degree of grammatical control. Does not make mistakes which lead to misunderstanding. Has a good command of simple language structures and some complex grammatical forms, although he/she tends to use complex structures rigidly with some inaccuracy."
    B1: "Upper B1: Communicates with reasonable accuracy in familiar contexts; generally good control though with noticeable mother tongue influence. Errors occur, but it is clear what he/she is trying to express. B1: Uses reasonably accurately a repertoire of frequently used 'routines' and patterns associated with more predictable situations."
    A2: "Uses some simple structures correctly, but still systematically makes basic mistakes – for example tends to mix up tenses and forget to mark agreement; nevertheless, it is usually clear what he/she is trying to say."
    A1: "Shows only limited control of a few simple grammatical structures and sentence patterns in a learnt repertoire."
  coherence_and_cohesion:
    C2: "Can create coherent and cohesive text making full and appropriate use of a variety of organisational patterns and a wide range of cohesive devices."
    C1: "Can produce clear, smoothly flowing, well-structured speech, showing controlled use of organisational patterns, connectors and cohesive devices. Can produce well-organised, coherent text, using a variety of cohesive devices and organisational patterns."
    B2: "Upper B2: Can use a variety of linking words efficiently to mark clearly the relationships between ideas. B2: Can use a limited number of cohesive devices to link his/her utterances into clear, coherent discourse. Though there may be some 'jumpiness' in a long contribution. Can produce text that is generally well-organised and coherent, using a range of linking words and cohesive devices."
    B1: "Upper B1: Can structure longer texts in clear, logical paragraphs. Can introduce a counter-argument in a simple discursive text (e.g. with 'however'). B1: Can link a series of shorter, discrete simple elements into a connected, linear sequence of points. Can form longer sentences and link them together using a limited number of cohesive devices, e.g. in a story. Can make simple, logical paragraph breaks in a longer text."
    A2: "Can use the most frequently occurring connectors to link simple sentences in order to tell a story or describe something as a simple list of points. Can link groups of words with simple connectors like 'and,' 'but' and 'because'."
    A1: "Can link words or groups of words with very basic linear connectors like 'and' or 'then'."
